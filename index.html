<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0614">
    <title>The Shadowed One</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0614;
                   touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0b0614; }
      #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 28px; background: radial-gradient(circle at 50% 40%, #2a1a45 0%, #0b0614 70%); color: #ffd440;
               font-family: 'Luckiest Guy', system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      #carga h1 { margin: 0; font-size: clamp(32px, 8vw, 72px); letter-spacing: 3px; text-shadow: 0 4px 0 #3a1a05; font-weight: normal; }
      #ojos { font-size: 22px; letter-spacing: 18px; color: #ffe066; text-shadow: 0 0 12px #ffcc33; animation: parpadeo 3s infinite; }
      @keyframes parpadeo { 0%, 92%, 100% { opacity: 1 } 95% { opacity: 0 } }
      #barra { width: min(70vw, 420px); height: 18px; border: 3px solid #ffd440; border-radius: 12px; overflow: hidden; background: #1a0f2a; }
      #relleno { width: 0%; height: 100%; background: linear-gradient(90deg, #ffb020, #ffe066); transition: width 0.2s; }
      #texto { color: #fff; font-size: 18px; opacity: 0.85; }
      #pantallaCompleta { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; display: none;
                          font-family: 'Luckiest Guy', system-ui, sans-serif; font-size: 16px; color: #0b0614; background: #ffd440;
                          border: none; border-radius: 20px; padding: 8px 18px; opacity: 0.85; }
      #elegir { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center;
                gap: 22px; background: radial-gradient(circle at 50% 40%, #2a1a45 0%, #0b0614 70%); color: #ffd440;
                font-family: 'Luckiest Guy', system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      #elegir h2 { margin: 0; font-size: clamp(24px, 5vw, 44px); font-weight: normal; letter-spacing: 2px; text-shadow: 0 3px 0 #3a1a05; }
      #opciones { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
      #opciones button { font-family: inherit; font-size: clamp(18px, 3vw, 26px); color: #0b0614; background: #ffd440; border: none;
                         border-radius: 18px; padding: 18px 26px; min-width: 220px; cursor: pointer; box-shadow: 0 5px 0 #a8740a; }
      #opciones button small { display: block; font-family: system-ui, sans-serif; font-size: 14px; margin-top: 6px; opacity: 0.8; }
      #opciones button:active { transform: translateY(3px); box-shadow: 0 2px 0 #a8740a; }
      #opciones button.sugerido { outline: 4px solid #fff; }
      /* VITRINA: carrusel de marcas arriba a la derecha mientras carga y al elegir como jugar */
      #vitrina { position: fixed; top: 14px; right: 14px; z-index: 20; width: min(36vw, 340px); display: none;
                 font-family: 'Luckiest Guy', system-ui, sans-serif; text-align: center; }
      #vitrina .cinta { display: inline-block; background: #dc2a33; color: #fff; padding: 5px 14px 3px; border-radius: 99px;
                        font-size: clamp(13px, 1.6vw, 18px); text-decoration: none; box-shadow: 0 3px 0 #7a141b;
                        margin-bottom: 8px; animation: latido 1.6s infinite; }
      @keyframes latido { 50% { transform: scale(1.08); } }
      #vitrina .letrero { position: relative; aspect-ratio: 2 / 1; border: 6px solid #6b4a2b; border-radius: 10px; overflow: hidden;
                          background: #000; box-shadow: 0 0 0 3px #ffd440, 0 10px 24px rgba(0,0,0,.6); }
      #vitrina .letrero::after { content: ""; position: absolute; inset: 0; border-radius: 4px; pointer-events: none;
                                 box-shadow: inset 0 0 0 3px #ffe680; animation: luces 1s steps(2) infinite; }
      @keyframes luces { 50% { box-shadow: inset 0 0 0 3px #ff5a3c; } }
      #vitrina img, #vitrina .propia { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
                                       transform: translateX(10%); transition: opacity .6s, transform .6s; }
      #vitrina .activa { opacity: 1; transform: none; }
      #vitrina .propia { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #fff1c2, #e8c87a);
                         color: #5a2a0a; font-size: clamp(18px, 2.6vw, 30px); line-height: 1.05; text-decoration: none; }
      #vitrina .sitio { display: block; margin-top: 6px; color: #ffe680; font-size: clamp(10px, 1.2vw, 13px); text-decoration: none; letter-spacing: .5px; }
      /* telefono: mas chico y siempre dentro de la pantalla (respeta la camara/esquinas con safe-area) */
      @media (max-width: 900px), (max-height: 500px) {
        #vitrina { width: min(30vw, 190px); top: calc(6px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); }
        #vitrina .letrero { border-width: 4px; box-shadow: 0 0 0 2px #ffd440, 0 6px 14px rgba(0,0,0,.6); }
        #vitrina .cinta { font-size: 11px; padding: 3px 9px 2px; margin-bottom: 5px; }
        #vitrina .sitio { font-size: 9px; }
        /* lo de la pantalla de carga baja un poco para no quedar debajo del letrero */
        #carga, #elegir { padding-top: 118px; gap: 16px; }
        #carga h1 { font-size: clamp(26px, 6vw, 48px); }
      }
      @media (orientation: portrait) and (max-width: 640px) {
        #vitrina { left: 50%; right: auto; transform: translateX(-50%); width: min(60vw, 240px); }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="carga">
      <h1>THE SHADOWED ONE</h1>
      <div id="ojos">● ●</div>
      <div id="barra"><div id="relleno"></div></div>
      <div id="texto">Cargando la aventura...</div>
    </div>
    <div id="elegir">
      <h2>¿CÓMO QUIERES JUGAR?</h2>
      <div id="opciones">
        <button id="modoBotones">📱 BOTONES EN PANTALLA<small>teléfono / tableta</small></button>
        <button id="modoTeclado">⌨️ TECLADO<small>computadora (PC)</small></button>
      </div>
    </div>
    <button id="pantallaCompleta">PANTALLA COMPLETA</button>
    <div id="vitrina">
      <a class="cinta" target="_blank" rel="noopener" href="https://arcade.especialidadinformatica.com/registro">¡ANÚNCIATE AQUÍ!</a>
      <div class="letrero" id="letrero">
        <a class="propia" target="_blank" rel="noopener" href="https://arcade.especialidadinformatica.com/">TU MARCA<br>AQUÍ</a>
      </div>
      <a class="sitio" target="_blank" rel="noopener" href="https://arcade.especialidadinformatica.com/">arcade.especialidadinformatica.com</a>
    </div>
    <script src="Build/web.loader.js"></script>
    <script>
      var esMovil = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // VITRINA: anuncios activos del servidor de publicidad (si no hay internet queda "TU MARCA AQUI")
      var vitrina = document.querySelector("#vitrina"), relojVitrina = null;
      vitrina.style.display = "block";
      (function () {
        var letrero = document.querySelector("#letrero"), i = 0;
        function mostrar(k) {
          var d = letrero.children;
          d[i].classList.remove("activa");
          i = (k + d.length) % d.length;
          d[i].classList.add("activa");
        }
        letrero.children[0].classList.add("activa");
        fetch("https://arcade.especialidadinformatica.com/api/juego/vitrina").then(function (r) { return r.json(); }).then(function (j) {
          (j.anuncios || []).forEach(function (a) {
            var img = new Image();
            img.alt = a.titulo; img.src = a.imagen;
            letrero.insertBefore(img, letrero.lastElementChild);
          });
          if (letrero.children.length > 1) {
            letrero.lastElementChild.classList.remove("activa"); // "tu marca aqui" queda para el final de la vuelta
            i = 0;
            mostrar(0);
            relojVitrina = setInterval(function () { mostrar(i + 1); }, 4000);
          }
        }).catch(function () {});
      })();
      var canvas = document.querySelector("#unity-canvas");
      var config = {
        dataUrl: "Build/web.data.unityweb",
        frameworkUrl: "Build/web.framework.js.unityweb",
        codeUrl: "Build/web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Chaleco",
        productName: "The Shadowed One",
        productVersion: "1.0",
      };
      // en el telefono se dibuja a resolucion normal (no "retina"): el juego va mucho mas fluido
      if (esMovil) config.devicePixelRatio = 1;

      createUnityInstance(canvas, config, function (progreso) {
        document.querySelector("#relleno").style.width = Math.round(progreso * 100) + "%";
      }).then(function (instancia) {
        document.querySelector("#carga").style.display = "none";
        // el jugador elige: botones en pantalla (telefono) o teclado (PC). Se le avisa al juego (Web/ControlesTactiles.cs)
        var elegir = document.querySelector("#elegir");
        document.querySelector(esMovil ? "#modoBotones" : "#modoTeclado").className = "sugerido";
        elegir.style.display = "flex";
        function modo(m) {
          instancia.SendMessage("ControlesTactiles", "ElegirModo", m);
          elegir.style.display = "none";
          vitrina.style.display = "none"; // ya se juega: dentro del juego estan los letreros y el menu
          if (relojVitrina) clearInterval(relojVitrina);
          canvas.focus();
        }
        document.querySelector("#modoBotones").onclick = function () { modo("botones"); };
        document.querySelector("#modoTeclado").onclick = function () { modo("teclado"); };
        if (esMovil && document.documentElement.requestFullscreen) {
          var b = document.querySelector("#pantallaCompleta");
          b.style.display = "block";
          b.onclick = function () {
            document.documentElement.requestFullscreen().then(function () {
              if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
            }).catch(function () {});
            b.style.display = "none";
          };
        }
      }).catch(function (mensaje) {
        document.querySelector("#texto").textContent = "No se pudo cargar el juego: " + mensaje;
      });
    </script>
  </body>
</html>
